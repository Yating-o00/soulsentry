<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#384877" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="心栈" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>灵魂哨兵 · SoulSentry</title>
    <script>
      (function() {
        var shown = false;
        function show(msg, stack, isWarn) {
          if (shown) return;
          shown = true;
          var pre = document.createElement('pre');
          pre.id = '__ss_diag__';
          pre.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;padding:24px;margin:0;background:#fff;color:' + (isWarn ? '#c60' : '#c00') + ';font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all;overflow:auto;font-family:monospace;';
          pre.textContent = msg + (stack ? '\n\n' + stack : '');
          if (document.body) document.body.appendChild(pre);
          else document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(pre); });
        }
        function append(msg) {
          var el = document.getElementById('__ss_diag__');
          if (el) { el.textContent += '\n' + msg; return; }
          var pre = document.createElement('pre');
          pre.id = '__ss_diag__';
          pre.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;padding:24px;margin:0;background:#fff;color:#333;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all;overflow:auto;font-family:monospace;';
          pre.textContent = msg;
          if (document.body) document.body.appendChild(pre);
          else document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(pre); });
        }
        window.__ssShowDiag = show;
        window.__ssAppendDiag = append;
        window.addEventListener('error', function(e) {
          show('Error: ' + (e.message || String(e.error)), e.error && e.error.stack);
        });
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          show('Unhandled: ' + (r && r.message ? r.message : String(r)), r && r.stack);
        });
        setTimeout(function() {
          var root = document.getElementById('root');
          var hasContent = root && (root.innerHTML || '').replace(/\s/g, '').length > 0;
          if (!hasContent) {
            var ua = navigator.userAgent || 'unknown';
            var modern = window.__vite_is_modern_browser;
            var info = [
              'Root still empty after 5s.',
              'UA: ' + ua,
              'Modern bundle: ' + (modern === true ? 'yes' : (modern === false ? 'no' : 'unknown')),
              'Scripts: ' + Array.prototype.slice.call(document.querySelectorAll('script')).map(function(s) { return s.src || s.getAttribute('data-src') || '[inline]'; }).join(', '),
              'ReadyState: ' + document.readyState,
              'Root HTML: ' + (root ? root.outerHTML : 'missing')
            ].join('\n');
            show('Timeout: ' + info, '', true);
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
