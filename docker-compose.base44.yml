services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    restart: unless-stopped

volumes:
  node_modules:
